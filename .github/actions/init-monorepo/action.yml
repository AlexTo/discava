name: Initialize Monorepo
description: Initialize nx monorepo for CI workflows

# Mirrors nx-plugin-for-aws's .github/actions/init-monorepo, trimmed to what
# this workspace needs (no image builds, Bun, Terraform or Smithy).

inputs:
  aws-docker-login-role-arn:
    description: 'ARN of the AWS role to assume to log Docker in to Amazon ECR Public, whose anonymous pulls are rate-limited per IP and shared GitHub runner IPs can exhaust. Leave empty to pull anonymously.'
    required: false
    default: ''
  setup-uv:
    description: 'Install uv/Python. Needed by jobs that run infra:checkov (via `uvx`), i.e. the build target. Disable for jobs that do not run Python tooling.'
    required: false
    default: 'true'
  set-nx-shas:
    description: 'Set NX_BASE/NX_HEAD for `nx affected`. Requires a full-history checkout (fetch-depth: 0). Disable for jobs that do not run `nx affected`.'
    required: false
    default: 'true'
  nx-cache-scope:
    description: "Keep Nx's task cache (.nx/cache and the database that indexes it, .nx/workspace-data) between runs, under this name, so a task whose inputs haven't changed since an earlier run is replayed, not run again. One name per job that runs different targets. Leave empty for jobs that run no cached Nx targets."
    required: false
    default: ''
  nx-cache-save:
    description: "Save this job's Nx cache when it ends, for its next run on the same branch. Each saved cache counts toward the repository's 10 GB of Actions cache, so disable it for a job whose tasks are quick to run again; it still restores main's."
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Nx keeps its task cache, and the database it looks cached tasks up in,
    # under ~/.nx unless told otherwise. Both are pinned to the checkout, where
    # the cache step below saves them. Set first, so no nx command or daemon
    # starts without them.
    #
    # The size cap is far below Nx's default (a share of the disk). Each save
    # carries on from the cache it restored, so without a cap the outputs of a
    # week of earlier commits ride along: about 760 MB compressed per saved
    # cache, where one full build's outputs are about 265 MB before
    # compression. Three of those per push to a pull request overran the
    # repository's 10 GB of Actions cache, which evicts the caches of pull
    # requests still open.
    - name: Keep the Nx cache in the checkout
      if: ${{ inputs.nx-cache-scope != '' }}
      shell: bash
      run: |
        echo "NX_CACHE_DIRECTORY=.nx/cache" >> "$GITHUB_ENV"
        echo "NX_WORKSPACE_DATA_DIRECTORY=.nx/workspace-data" >> "$GITHUB_ENV"
        echo "NX_MAX_CACHE_SIZE=1GB" >> "$GITHUB_ENV"
    # Credentials go to step outputs rather than the job environment, so the
    # login role is only ever used by the login step below.
    - name: Docker login credentials
      id: docker-login-credentials
      if: ${{ inputs.aws-docker-login-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-docker-login-role-arn }}
        # ECR Public only issues authorization tokens in us-east-1.
        aws-region: us-east-1
        output-credentials: true
        output-env-credentials: false
    - name: Log in to Amazon ECR Public
      if: ${{ inputs.aws-docker-login-role-arn != '' }}
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.docker-login-credentials.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.docker-login-credentials.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.docker-login-credentials.outputs.aws-session-token }}
      run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    # pnpm/setup downloads pnpm from the npm registry, which now and then
    # times out from GitHub's runners ("Could not reach
    # https://registry.npmjs.org/@pnpm/...: timed out after 30s"), failing
    # the whole job before it starts. Steps can't retry themselves, so it gets
    # up to three tries, a little apart; only the last one fails the job.
    - name: Use PNPM
      id: pnpm-setup-1
      continue-on-error: true
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        install: 'false'
    - name: Wait before trying PNPM again
      if: ${{ steps.pnpm-setup-1.outcome == 'failure' }}
      shell: bash
      run: sleep 15
    - name: Use PNPM (second try)
      id: pnpm-setup-2
      if: ${{ steps.pnpm-setup-1.outcome == 'failure' }}
      continue-on-error: true
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        install: 'false'
    - name: Wait before trying PNPM a last time
      if: ${{ steps.pnpm-setup-2.outcome == 'failure' }}
      shell: bash
      run: sleep 45
    - name: Use PNPM (last try)
      if: ${{ steps.pnpm-setup-2.outcome == 'failure' }}
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        install: 'false'
    # Node 24 matches the Lambda runtime (nodejs24.x).
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Install the latest version of uv
      if: ${{ inputs.setup-uv == 'true' }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 'latest'
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    # Newer than nx-plugin-for-aws's pin (v4), which runs on the deprecated
    # Node.js 20 runtime.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install Node.js Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile --prefer-offline
    # Saved per commit, since a cache can't be overwritten, and restored from
    # the newest one: this job's on an earlier push to the same branch, or
    # else main's (ci.yml), the only other ref a pull request can read caches
    # from. Nx removes old entries and keeps the cache under
    # NX_MAX_CACHE_SIZE (above), so it doesn't grow without bound.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Setup Nx cache
      if: ${{ inputs.nx-cache-scope != '' && inputs.nx-cache-save == 'true' }}
      with:
        path: |
          .nx/cache
          .nx/workspace-data
        key: ${{ runner.os }}-nx-${{ inputs.nx-cache-scope }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.nx-cache-scope }}-
          ${{ runner.os }}-nx-main-
    # The same restore, with nothing saved when the job ends.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Restore Nx cache
      if: ${{ inputs.nx-cache-scope != '' && inputs.nx-cache-save != 'true' }}
      with:
        path: |
          .nx/cache
          .nx/workspace-data
        key: ${{ runner.os }}-nx-${{ inputs.nx-cache-scope }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ inputs.nx-cache-scope }}-
          ${{ runner.os }}-nx-main-
    - if: ${{ inputs.set-nx-shas == 'true' }}
      uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
