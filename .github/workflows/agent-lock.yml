name: Agent Lock

# Locks what an agent is handed, so only collaborators with write access can
# comment on it: the agents read every comment while holding AWS credentials,
# the test users and a token that can push, and anyone can comment on a public
# repository. This covers what no workflow of ours opened:
# - an issue someone labels `openhands` or `openhands-test` by hand;
# - a pull request the agent opens (branch `openhands/...`, not from a fork).
# The issues Agent Issues and Post-merge Verify open are locked by their own
# scripts: GitHub starts no workflow for a label the workflow token applied.
# Comments written before an issue was labelled stay; read them first.
# The rules are in packages/tooling/agent/src/agent-lock/.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened]

env:
  CI: "true"

permissions:
  contents: read
  issues: write
  # Locking a pull request goes through the issues API, which refuses the
  # workflow's token for a pull request unless it can write pull requests too.
  pull-requests: write

jobs:
  lock:
    name: Lock the agent's conversation
    if: >-
      (github.event_name == 'issues' &&
      (github.event.label.name == 'openhands' ||
      github.event.label.name == 'openhands-test')) ||
      (github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'openhands/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/init-monorepo
        with:
          setup-uv: false
          set-nx-shas: false

      - name: Lock
        run: pnpm nx run @discava/tooling-agent:agent-lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
