name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_DAEMON: "true"

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the build target invokes checkov (via infra:checkov's `uvx`), so
      # only that leg needs uv. init-monorepo also sets NX_BASE/NX_HEAD so
      # `nx affected` diffs against the PR's target branch.
      #
      # The lint leg restores main's Nx cache but saves none of its own: Biome
      # lints the projects a pull request changed in seconds, less time than
      # saving a cache takes, and the cache would count toward the
      # repository's 10 GB.
      - uses: ./.github/actions/init-monorepo
        with:
          setup-uv: ${{ matrix.target == 'build' }}
          nx-cache-scope: ${{ matrix.target }}
          nx-cache-save: ${{ matrix.target != 'lint' }}

      # Four tasks at a time, not nx.json's eight: each Vitest task starts
      # workers of its own, and eight of them on a runner's few cores took
      # about 13% longer than four when timed on four cores.
      - name: Run ${{ matrix.target }}
        run: pnpm nx affected --target ${{ matrix.target }} --parallel=4

      - name: Upload coverage reports to Codecov
        if: matrix.target == 'test'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # A feature's tasks.md is read by the Agent Issues workflow to decide which
  # tasks the implementing agent gets, and a file that strays from the format
  # is misread silently. Checks every specs/*/tasks.md, when one of them or
  # the code that reads them changed.
  tasks-format:
    name: Tasks format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether a tasks.md or its reader changed
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            specs/*/tasks.md
            packages/tooling/agent/src/agent-issues/

      - uses: ./.github/actions/init-monorepo
        if: steps.changed.outputs.changed == 'true'
        with:
          setup-uv: "false"
          set-nx-shas: "false"

      - name: Validate every tasks.md
        if: steps.changed.outputs.changed == 'true'
        run: pnpm nx run @discava/tooling-agent:validate-tasks

  # A pull request that changes portal or shared UI source must add a
  # `screenshot(` call to an e2e scenario, so the `E2E screenshots` comment
  # shows the reviewer the change. A maintainer waives it with the
  # `no-ui-screenshots` label and re-runs this job (the labels are read when
  # it runs, so labelling doesn't restart the other checks). The rules are in
  # packages/tooling/agent/src/ui-screenshots/.
  ui-screenshots:
    name: UI Screenshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/init-monorepo
        with:
          setup-uv: "false"
          set-nx-shas: "false"

      - name: Check the pull request
        run: pnpm nx run @discava/tooling-agent:ui-screenshots
        env:
          GH_TOKEN: ${{ github.token }}

  # A pull request that changes who writes the core table (an entity gaining
  # a second writing package, a new direct write to an entity several
  # packages write, or a new entity) must also change core-table's
  # helpers/invariants.ts, since rules spanning those writers are what it
  # checks. A maintainer waives it with the `no-new-invariant` label and
  # re-runs this job. It also fails while core-table's entity-writers.json,
  # the map it compares with the base branch's, is out of date with the code.
  # The rules are in packages/tooling/agent/src/invariant-coverage/.
  invariant-coverage:
    name: Invariant coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether code that could write the core table changed
        id: changed
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            packages/apis
            packages/events
            packages/databases
            packages/tooling

      - uses: ./.github/actions/init-monorepo
        if: steps.changed.outputs.changed == 'true'
        with:
          setup-uv: "false"
          set-nx-shas: "false"

      - name: Check the pull request
        if: steps.changed.outputs.changed == 'true'
        run: pnpm nx run @discava/tooling-agent:invariant-coverage
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}

  # End-to-end tests (#3): Playwright drives the portals in Chromium against
  # the whole local stack, which it starts with `pnpm dev` (DynamoDB local,
  # S3Mock and the local OIDC server in Docker; no AWS). Only when something
  # the e2e project depends on changed.
  #
  # Sharded over runners, each starting its own stack (E2E_SHARD, read by
  # playwright.config.ts, which gives each shard files adding up to about the
  # same run time). A shard costs about two minutes before its first test
  # (install, stack start-up), so more of them stop paying off once the tests
  # in each take about that long. The `E2E tests` job below gathers the legs into one
  # check, so a required check by that name keeps working whatever the count.
  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    permissions:
      contents: read
      # For the Docker login role (below).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Logged in to ECR Public, as the Trivy job is: DynamoDB local's image is
      # there, and ECR Public refuses anonymous pulls from shared GitHub runner
      # IPs once their quota's used ("Data limit exceeded").
      - uses: ./.github/actions/init-monorepo
        with:
          aws-docker-login-role-arn: ${{ vars.AWS_DOCKER_LOGIN_ROLE_ARN }}
          setup-uv: "false"

      # Chromium's download is cached per Playwright version.
      - uses: ./.github/actions/playwright-setup

      # Static output, so the job log lists each test even when they all pass.
      - name: Run e2e
        run: pnpm nx affected --target e2e --output-style=static

      # Always, unlike the failure artifacts: the pictures a scenario takes of
      # what the pull request changed (helpers/screenshots.ts), listed in the
      # `E2E screenshots` comment. A shard with none uploads nothing.
      - name: Upload the pull request screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: dist/packages/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, screenshots and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            dist/packages/e2e/test-results
            dist/packages/e2e/report
          retention-days: 14

  e2e-result:
    name: E2E tests
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any e2e shard failed or was cancelled
        # `skipped` is fine: nothing the e2e project depends on changed.
        run: |
          [ "${{ needs.e2e.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "cancelled" ] && exit 1
          exit 0

  # One comment on the pull request, kept up to date, naming the screenshots
  # the e2e scenarios took (and where to download them). Images can't be
  # embedded: an artifact has no public URL. Only for a pull request from this
  # repository, whose token can write; a fork's can't.
  e2e-screenshots:
    name: E2E screenshots
    needs: e2e
    if: >-
      always() && needs.e2e.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      # The default branch's code, not the pull request's: this job can write
      # to the pull request, so it never runs anything the pull request wrote
      # (it only reads the diff from the API, like ui-screenshots.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: ./.github/actions/init-monorepo
        with:
          setup-uv: false
          set-nx-shas: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: e2e-screenshots-*
          path: screenshots

      # Leads with the pictures whose `screenshot(` call this pull request
      # adds, and folds the ones from scenarios that were already there.
      - name: Comment on the pull request
        run: pnpm nx run @discava/tooling-agent:screenshots-comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
