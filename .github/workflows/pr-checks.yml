name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_DAEMON: "true"

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the build target invokes checkov (via infra:checkov's `uvx`), so
      # only that leg needs uv. init-monorepo also sets NX_BASE/NX_HEAD so
      # `nx affected` diffs against the PR's target branch.
      - uses: ./.github/actions/init-monorepo
        with:
          setup-uv: ${{ matrix.target == 'build' }}

      - name: Run ${{ matrix.target }}
        run: pnpm nx affected --target ${{ matrix.target }}

      - name: Upload coverage reports to Codecov
        if: matrix.target == 'test'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # A feature's tasks.md is read by the Agent Issues workflow to decide which
  # tasks the implementing agent gets, and a file that strays from the format
  # is misread silently. Checks every specs/*/tasks.md, when one of them or
  # the code that reads them changed.
  tasks-format:
    name: Tasks format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check whether a tasks.md or its reader changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- \
            'specs/*/tasks.md' 'packages/common/scripts/src/agent-issues/'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/init-monorepo
        if: steps.changed.outputs.run == 'true'
        with:
          setup-uv: "false"
          set-nx-shas: "false"

      - name: Validate every tasks.md
        if: steps.changed.outputs.run == 'true'
        run: pnpm nx run @discava/common-scripts:validate-tasks

  # End-to-end tests (#3): Playwright drives the portals in Chromium against
  # the whole local stack, which it starts with `pnpm dev` (DynamoDB local,
  # S3Mock and the local OIDC server in Docker; no AWS). Only when something
  # the e2e project depends on changed.
  #
  # Sharded over runners, each starting its own stack (E2E_SHARD, read by
  # playwright.config.ts). The `E2E tests` job below gathers the legs into one
  # check, so a required check by that name keeps working whatever the count.
  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    permissions:
      contents: read
      # For the Docker login role (below).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Logged in to ECR Public, as the Trivy job is: DynamoDB local's image is
      # there, and ECR Public refuses anonymous pulls from shared GitHub runner
      # IPs once their quota's used ("Data limit exceeded").
      - uses: ./.github/actions/init-monorepo
        with:
          aws-docker-login-role-arn: ${{ vars.AWS_DOCKER_LOGIN_ROLE_ARN }}
          setup-uv: "false"

      - name: Install Chromium for Playwright
        run: pnpm --filter @discava/e2e exec playwright install --with-deps chromium

      # Static output, so the job log lists each test even when they all pass.
      - name: Run e2e
        run: pnpm nx affected --target e2e --output-style=static

      - name: Upload traces, screenshots and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            dist/packages/e2e/test-results
            dist/packages/e2e/report
          retention-days: 14

  e2e-result:
    name: E2E tests
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any e2e shard failed or was cancelled
        # `skipped` is fine: nothing the e2e project depends on changed.
        run: |
          [ "${{ needs.e2e.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "cancelled" ] && exit 1
          exit 0
