name: Agent Review Status

# Sends the implementing agent back to fix a pull request the OpenHands
# reviewer asked changes on.
#
# The Issue-to-PR automation revises a pull request, in the conversation that
# opened it, when the pull request's latest commit has a commit status named
# `software-factory/review` in state `failure` or `error`. The reviewer's
# "🔄 CHANGES REQUESTED" verdict sets no status, so nothing woke the agent.
# This posts it when the reviewer submits such a review on an agent's branch
# (`openhands/issue-<n>`), at most five times per pull request (labels
# `review-fix-1` to `review-fix-5`), then comments and stops
# (`review-fix-exhausted`). The reviewer looks again by itself once the agent
# pushes: a new head commit is a new review for its scan.
# The rules are in packages/tooling/agent/src/agent-review/.

on:
  pull_request_review:
    types: [submitted]

concurrency:
  # One run at a time per pull request, so two reviews can't each count an
  # attempt at once.
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  # Labels and comments on a pull request go through the issues API, which
  # refuses the workflow's token for a pull request unless it can write pull
  # requests too.
  issues: write
  pull-requests: write

jobs:
  review-status:
    name: Send the agent back after a review asking for changes
    if: >-
      startsWith(github.event.pull_request.head.ref, 'openhands/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.review.body, 'CHANGES REQUESTED')
    uses: ./.github/workflows/agent-status.yml
    with:
      target: agent-review-status
